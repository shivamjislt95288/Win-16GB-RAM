name: Win

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'RDP Password (min 12 chars, include upper, lower, number, special)'
        required: true
        type: string
  push:
    branches: [ main ]

jobs:
  windows-rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Mask User-Provided Password
        shell: pwsh
        run: |
          $password = "${{ github.event.inputs.rdp_password }}"
          if ($password) {
            Write-Host "::add-mask::$password"
            echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          } else {
            # Fallback: auto-generate if triggered via push (no input)
            Add-Type -AssemblyName System.Security
            $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
            }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
            Write-Host "::add-mask::$password"
            echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          }
          Write-Host "✅ Password set and masked."

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpTcpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          
          # Verify paths exist before modifying
          if (-not (Test-Path $rdpPath)) { Write-Error "RDP registry path missing: $rdpPath"; exit 1 }
          if (-not (Test-Path $rdpTcpPath)) { Write-Error "RDP-Tcp registry path missing: $rdpTcpPath"; exit 1 }
          
          Set-ItemProperty -Path $rdpPath -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path $rdpTcpPath -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path $rdpTcpPath -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP enabled on port 3389."

      - name: Create RDP User with Provided Password
        shell: pwsh
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: ***MASKED***" >> $env:GITHUB_ENV
          Write-Host "✅ RDP user 'RDP' created with admin + RDP access."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "✅ Tailscale 1.82.0 installed."

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-windows-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
              Start-Sleep -Seconds 3
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned after 20 retries."
              & "$env:ProgramFiles\Tailscale\tailscale.exe" status
              exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale connected: $tsIP"

      - name: Display Access Info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║  🖥️  RDP ACCESS DETAILS                    ║" -ForegroundColor Green
          Write-Host "║                                          ║" -ForegroundColor Green
          Write-Host "║  IP: $env:TAILSCALE_IP:3389              ║" -ForegroundColor Green
          Write-Host "║  User: RDP                               ║" -ForegroundColor Green
          Write-Host "║  Pass: *** (masked - check your input)  ║" -ForegroundColor Green
          Write-Host "║                                          ║" -ForegroundColor Green
          Write-Host "╚══════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""
          Write-Host "🚀 Connect with any RDP client (Windows Remote Desktop, Remmina, etc.)"
          Write-Host "💡 Tip: Save as .rdp file for quick reconnects"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "🔄 RDP SESSION ACTIVE - Press Ctrl+C to stop (workflow will timeout after 1hr)"
          while ($true) {
              # Keep RDP service running
              $rdpSvc = Get-Service TermService -ErrorAction SilentlyContinue
              if ($rdpSvc -and $rdpSvc.Status -ne "Running") { 
                  Start-Service TermService -ErrorAction SilentlyContinue 
              }
              
              # Restart Tailscale if disconnected
              $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status --json 2>$null
              if ($tsStatus -notmatch '"LoggedIn":true') { 
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} 
                  Start-Sleep -Seconds 5
              }
              
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ Active - RDP: $env:TAILSCALE_IP:3389"
              Start-Sleep -Seconds 300
          }
