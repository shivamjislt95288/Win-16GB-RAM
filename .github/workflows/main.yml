name: Win

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'RDP Password (min 12 chars, include upper, lower, number, special)'
        required: true
        type: string
  push:
    branches: [ main ]

jobs:
  windows-rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Mask User-Provided Password
        shell: pwsh
        run: |
          $password = "${{ github.event.inputs.rdp_password }}"
          if ($password) {
            Write-Host "::add-mask::$password"
            echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          } else {
            # Fallback: auto-generate if triggered via push (no input)
            Add-Type -AssemblyName System.Security
            $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
            }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
            Write-Host "::add-mask::$password"
            echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          }
          Write-Host "✅ Password set and masked."

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP enabled."

      - name: Create RDP User with Provided Password
        shell: pwsh
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $env:RDP_PASSWORD" >> $env:GITHUB_ENV
          Write-Host "✅ RDP user created."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "✅ Tailscale installed."

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          & "$env:ProgramFilesTailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-windows-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFilesTailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale connected: $tsIP."

      - name: Display Access Info
        shell: pwsh
        run: |
          Write-Host "╔══════════════════════════════════════════╗"
          Write-Host "║  🖥️ RDP: $env:TAILSCALE_IP:3389          ║"
          Write-Host "║  👤 Username: RDP                         ║"
          Write-Host "║  🔑 Password: $env:RDP_PASSWORD           ║"
          Write-Host "╚══════════════════════════════════════════╝"
          Write-Host "Connect via RDP client to access Windows GUI."

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "=== RDP SESSION ACTIVE ==="
          while ($true) {
              $rdpSvc = Get-Service TermService
              if ($rdpSvc.Status -ne "Running") { Start-Service TermService }
              $tsStatus = & "$env:ProgramFilesTailscale\tailscale.exe" status
              if ($tsStatus -notmatch "Logged in") { & "$env:ProgramFilesTailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} }
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Active - RDP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }
